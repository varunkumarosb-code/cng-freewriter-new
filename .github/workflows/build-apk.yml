name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          # Generate icons
          npx @capacitor/assets generate --android --assetPath assets || true
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          npx cap sync android

      - name: Build Clean Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: Sign APK with Committed Permanent Keystore
        run: |
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Signing APK: $APK_FILE"
          
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name "apksigner" | sort -V | tail -n 1)
          
          $APKSIGNER sign --ks signing/cngwriter-permanent.keystore \
            --ks-pass pass:cngwriter2026 \
            --ks-key-alias cngwriter \
            --key-pass pass:cngwriter2026 \
            --out cng-writer-release.apk \
            "$APK_FILE"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cng-writer-apk
          path: cng-writer-release.apk
          retention-days: 14
