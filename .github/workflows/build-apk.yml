name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Pre-installed Android SDK & Licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Bubblewrap CLI & Config
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          EOF

      - name: Generate Signing Keystore
        run: |
          keytool -genkey -v -keystore android.keystore -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cngwriter123 -keypass cngwriter123 \
            -dname "CN=CnG, OU=Soft, O=CnG, L=IST, S=IST, C=IN"

      - name: Initialize & Build APK via Bubblewrap
        run: |
          # Initialize headless from manifest
          bubblewrap init --manifest https://writer.tiafa.cc.cd/manifest.json --skipConfig
          
          # Build APK with keystore credentials
          bubblewrap build \
            --signingKeyPath ./android.keystore \
            --signingKeyAlias android \
            --password cngwriter123 \
            --keyPassword cngwriter123 || (cd app && ./gradlew assembleRelease || ./gradlew assembleDebug)

      - name: Locate & Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cng-writer-apk
          path: |
            **/*.apk
          retention-days: 14
