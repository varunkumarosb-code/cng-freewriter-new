name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment & Licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Bubblewrap CLI & Global Config
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          EOF

      - name: Create Self-Signed Keystore
        run: |
          keytool -genkey -v -keystore android.keystore -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cngwriter123 -keypass cngwriter123 \
            -dname "CN=CnG Writer, OU=Soft, O=CnG, L=IST, S=IST, C=IN"

      - name: Pre-generate Non-Interactive twa-manifest.json
        run: |
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.cngsoft.writer",
            "host": "writer.tiafa.cc.cd",
            "name": "CnG Writer",
            "launcherName": "CnG Writer",
            "themeColor": "#131f1c",
            "navigationColor": "#0d1413",
            "backgroundColor": "#0d1413",
            "startUrl": "/",
            "iconUrl": "https://writer.tiafa.cc.cd/icons/icon-512.png",
            "maskableIconUrl": "https://writer.tiafa.cc.cd/icons/icon-512.png",
            "appVersionCode": 1,
            "appVersionName": "2.0.0",
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://writer.tiafa.cc.cd/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableNotifications": false,
            "minSdkVersion": 21
          }
          EOF

      - name: Build Android App via Bubblewrap & Gradle
        run: |
          # Build project directly from pre-defined twa-manifest without init prompts
          npx @bubblewrap/cli build \
            --signingKeyPath ./android.keystore \
            --signingKeyAlias android \
            --password cngwriter123 \
            --keyPassword cngwriter123 \
            --skipVersionCheck || (cd app && ./gradlew assembleRelease || ./gradlew assembleDebug)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cng-writer-apk
          path: "**/*.apk"
          retention-days: 7
