name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies & Build Web App
        run: |
          npm ci
          npm run build

      - name: Setup Capacitor & Configure Android Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          # Generate verified adaptive icons from assets/
          npx @capacitor/assets generate --android --assetPath assets
          # Set SDK path for Gradle
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cng-writer-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
