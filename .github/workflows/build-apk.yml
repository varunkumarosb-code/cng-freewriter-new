name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies & Build Web App
        run: |
          npm ci
          npm run build

      - name: Setup Capacitor & Configure Android Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "CnG Writer" "com.cngsoft.writer" --web-dir dist
          npx cap add android
          # Explicitly set SDK location for Gradle
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          npx cap sync android

      - name: Generate Android Branding Assets
        run: |
          npm install -g @capacitor/assets
          # This tool generates all mipmaps, adaptive icons, and XMLs automatically
          npx @capacitor/assets generate --android --icon-background-color '#0d1413'

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cng-writer-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
